# Runs the SquadSense data job. Supabase starts it on a timer (see
# db/sync-schedule.sql): GitHub's own schedule skipped most runs, but it
# starts a run straight away when asked through its API.
# Needs two repository secrets: DATABASE_URL (Supabase connection string)
# and FPL_TEAM_ID. SQUADSENSE_LEAGUES and the alert secrets are optional
# (see the README).
#
# The repository is public (since 24 November 2026), so Actions minutes are
# free and unlimited. The schedule is 12 runs a day plus a nightly refresh
# that only downloads players whose club played in the last 36 hours.

name: Sync FPL data

on:
  workflow_dispatch:              # Supabase's timer, or you by hand from the Actions tab
    inputs:
      full:
        description: "Also refresh players whose club played in the last 36 hours (up to 13 minutes after a full matchday)"
        type: boolean
        default: false
      tests:
        description: "Also run the test suite (about 10 minutes)"
        type: boolean
        default: false
      test_alert:
        description: "Only send a test email and phone alert (skips the sync)"
        type: boolean
        default: false

# A run that starts while another is going waits for it, so two syncs
# never write at once.
concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # The first sync after each deadline reads about 400 rivals' picks (one
    # request a second), so it can take 15 minutes longer than the others.
    timeout-minutes: 45
    defaults:
      run:
        working-directory: jobs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: jobs/requirements.txt
      - run: pip install -r requirements.txt
      - name: Run sync
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FPL_TEAM_ID: ${{ secrets.FPL_TEAM_ID }}
          SQUADSENSE_LEAGUES: ${{ secrets.SQUADSENSE_LEAGUES }}
          # Alerts (all optional; without them nothing is sent). See the README.
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          if [ "${{ inputs.test_alert }}" = "true" ]; then
            python -m squadsense.alerts --test
          elif [ "${{ inputs.full }}" = "true" ]; then
            python -m squadsense.sync --full
          else
            python -m squadsense.sync
          fi

  test:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.tests
    defaults:
      run:
        working-directory: jobs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
