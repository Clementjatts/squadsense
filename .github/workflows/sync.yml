# Runs the SquadSense data job on a schedule.
# Needs two repository secrets: DATABASE_URL (Supabase connection string)
# and FPL_TEAM_ID. SQUADSENSE_LEAGUES and the alert secrets are optional
# (see the README).
# Times are UTC, which matches UK time in winter.
#
# The repository is private, so GitHub gives 2,000 free minutes a month and
# bills each run as at least one minute. This schedule uses roughly 900 to
# 1,000: 12 runs a day plus a nightly refresh that only downloads players
# whose club played in the last 36 hours.

name: Sync FPL data

on:
  schedule:
    - cron: "17 7-21/2 * * *"    # every 2 hours from 07:17 to 21:17
    - cron: "15,45 22-23 * * *"  # 22:15, 22:45, 23:15 and 23:45, before the midnight price change
    - cron: "37 1 * * *"         # once a night: refresh players whose club just played
  workflow_dispatch:              # lets you run it by hand from the Actions tab
    inputs:
      full:
        description: "Also refresh players whose club played in the last 36 hours (up to 13 minutes after a full matchday)"
        type: boolean
        default: false
      tests:
        description: "Also run the test suite (about 10 minutes)"
        type: boolean
        default: false
      test_alert:
        description: "Only send a test email and phone alert (skips the sync)"
        type: boolean
        default: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: jobs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: jobs/requirements.txt
      - run: pip install -r requirements.txt
      - name: Run sync
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FPL_TEAM_ID: ${{ secrets.FPL_TEAM_ID }}
          SQUADSENSE_LEAGUES: ${{ secrets.SQUADSENSE_LEAGUES }}
          # Alerts (all optional; without them nothing is sent). See the README.
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          if [ "${{ inputs.test_alert }}" = "true" ]; then
            python -m squadsense.alerts --test
          elif [ "${{ github.event.schedule }}" = "37 1 * * *" ] || [ "${{ inputs.full }}" = "true" ]; then
            python -m squadsense.sync --full
          else
            python -m squadsense.sync
          fi

  test:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.tests
    defaults:
      run:
        working-directory: jobs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
