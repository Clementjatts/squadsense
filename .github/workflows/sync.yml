# Runs the SquadSense data job on a schedule.
# Needs two repository secrets: DATABASE_URL (Supabase connection string)
# and FPL_TEAM_ID. Times are UTC, which matches UK time in winter.

name: Sync FPL data

on:
  schedule:
    - cron: "7 * * * *"          # every hour
    - cron: "*/15 21-23 * * *"   # every 15 minutes before the midnight price change
    - cron: "37 1 * * *"         # once a night after prices move: refresh every player
  workflow_dispatch:              # lets you run it by hand from the Actions tab
    inputs:
      full:
        description: "Refresh every player's history (takes about 13 minutes)"
        type: boolean
        default: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: jobs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: jobs/requirements.txt
      - run: pip install -r requirements.txt
      - name: Run sync
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FPL_TEAM_ID: ${{ secrets.FPL_TEAM_ID }}
        run: |
          if [ "${{ github.event.schedule }}" = "37 1 * * *" ] || [ "${{ inputs.full }}" = "true" ]; then
            python -m squadsense.sync --full
          else
            python -m squadsense.sync
          fi

  test:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: jobs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
